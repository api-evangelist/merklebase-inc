aid: merklebase-inc
name: Merklebase, Inc.
description: Merklebase provides data-driven infrastructure for institutional digital-asset
  finance, spanning enterprise data management, a core portfolio management system, reporting
  and accounting, risk management, a trade capture system, and a digital-asset loan management
  system. It advertises connectivity to 220+ custodians, trading venues, and data providers,
  and is used by hedge funds, asset managers, and financial institutions to streamline
  front-to-back operations across fiat, crypto, derivatives, and stablecoins. A developer
  API and connectivity layer is referenced by customers, but the public developer surface
  (docs.merklebase.io on Theneo) is currently unpublished and the API (api.merklebase.io,
  AWS API Gateway) is gated, so no public OpenAPI/SDK artifacts are harvestable yet.
